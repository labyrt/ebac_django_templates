<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Meu Blog{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f3f4f6; color: #212529; }
        .blog-hero { background: #168bd2; color: white; padding: 3.5rem 0; }
        .post-card { border: 0; border-radius: 0; box-shadow: 0 1px 4px rgb(0 0 0 / 8%); }
        .sidebar-card { border: 0; box-shadow: 0 1px 4px rgb(0 0 0 / 8%); }
        .sidebar-card .card-header { background: white; font-size: 1.35rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'blog:post-list' %}">Django</a>
        </div>
    </nav>

    <header class="blog-hero">
        <div class="container">
            <h1 class="display-5 fw-normal">Welcome to my awesome Blog</h1>
            <p class="lead mb-0">We Love Django As much as you do..!</p>
        </div>
    </header>

    <main class="container py-4">
        <div class="row g-4">
            <section class="col-lg-8">
                {% block content %}{% endblock %}
            </section>
            <aside class="col-lg-4">
                {% include "sidebar.html" %}
            </aside>
        </div>
    </main>
</body>
</html>
