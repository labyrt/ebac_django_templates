{% extends "base.html" %}

{% block title %}{{ post.title }} | Meu Blog{% endblock %}

{% block content %}
    <article class="card post-card">
        <div class="card-body p-4">
            <h1 class="fw-normal">{{ post.title }}</h1>
            <p class="text-muted">
                {{ post.author.username }} | {{ post.created_at|date:"d/m/Y, H:i" }}
            </p>
            <div class="fs-5">{{ post.body|linebreaks }}</div>
            <a class="btn btn-outline-primary mt-3" href="{% url 'blog:post-list' %}">
                ← Voltar para os posts
            </a>
        </div>
    </article>
{% endblock %}
